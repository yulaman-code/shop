<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Личный кабинет — Магазин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="logo">Магазин</a>
    <div class="nav-links">
      {{if .CurrentUser.IsAdmin}}<a href="/admin">Админка</a>{{end}}
      <a href="/cart">Корзина</a>
      <a href="/account">Мои заказы</a>
      <a href="/logout">Выйти ({{.CurrentUser.Username}})</a>
    </div>
  </nav>

  <div class="cart-page">
    <h2>Мои заказы</h2>

    {{if .Orders}}
    <table class="cart-table">
      <thead>
        <tr><th>Номер</th><th>Дата</th><th>Сумма</th><th></th></tr>
      </thead>
      <tbody>
        {{range .Orders}}
        <tr>
          <td>N{{.ID}}</td>
          <td>{{.CreatedAt}}</td>
          <td>{{.Total}} P</td>
          <td><a href="/order/{{.ID}}">Подробнее</a></td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <p class="empty">У вас пока нет заказов. <a href="/">Перейти в каталог</a></p>
    {{end}}
  </div>
</body>
</html>
