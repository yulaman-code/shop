<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Корзина — Магазин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="logo">Магазин</a>
    <div class="nav-links">
      <a href="/logout">Выйти ({{.CurrentUser.Username}})</a>
    </div>
  </nav>

  <div class="cart-page">
    <h2>Корзина</h2>

    {{if .Lines}}
    <table class="cart-table">
      <thead>
        <tr><th>Товар</th><th>Цена</th><th>Кол-во</th><th>Сумма</th><th></th></tr>
      </thead>
      <tbody>
        {{range .Lines}}
        <tr data-row-id="{{.ProductID}}">
          <td>{{.Title}}</td>
          <td>{{.Price}} ₽</td>
          <td>
            <input
              type="number"
              class="qty-input qty-live"
              value="{{.Quantity}}"
              min="0"
              data-product-id="{{.ProductID}}"
              data-price="{{.Price}}"
            >
          </td>
          <td class="subtotal-cell" data-subtotal-for="{{.ProductID}}">{{.Subtotal}} ₽</td>
          <td>
            <form method="POST" action="/cart/remove/{{.ProductID}}">
              <button type="submit" class="small-btn">Удалить</button>
            </form>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>

    <div class="cart-total" id="cart-total">Итого: {{.Total}} ₽</div>

    <form method="POST" action="/cart/checkout">
      <button type="submit">Оформить заказ</button>
    </form>
    {{else}}
    <p class="empty">Корзина пуста. <a href="/">Вернуться в каталог</a></p>
    {{end}}
  </div>

  <script>
    // saveTimers — храним по одному "таймеру ожидания" на каждый товар,
    // чтобы не отправлять запрос на сервер при КАЖДОМ нажатии клавиши,
    // а только когда пользователь на секунду остановился вводить число.
    // Это называется "debounce" (сглаживание частых событий).
    const saveTimers = {};

    function recalcTotals() {
      let total = 0;
      document.querySelectorAll('.qty-live').forEach((input) => {
        const price = parseInt(input.dataset.price, 10);
        const quantity = parseInt(input.value, 10) || 0;
        const subtotal = price * quantity;
        total += subtotal;

        const cell = document.querySelector(
          `[data-subtotal-for="${input.dataset.productId}"]`
        );
        if (cell) {
          cell.textContent = subtotal + ' ₽';
        }
      });

      document.getElementById('cart-total').textContent = 'Итого: ' + total + ' ₽';
    }

    function scheduleSave(productId, quantity) {
      // Если для этого товара уже был запланирован запрос — отменяем его
      // и планируем заново. Так, если пользователь быстро крутит стрелочки
      // ввода 5 раз подряд, на сервер уйдёт только ОДИН запрос, а не 5.
      clearTimeout(saveTimers[productId]);

      saveTimers[productId] = setTimeout(() => {
        fetch(`/cart/update/${productId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `quantity=${quantity}`,
        }).then(() => {
          if (quantity <= 0) {
            // Товар удалён на сервере — обновляем страницу,
            // чтобы строка тоже пропала визуально
            location.reload();
          }
        });
      }, 500);
    }

    document.querySelectorAll('.qty-live').forEach((input) => {
      input.addEventListener('input', () => {
        recalcTotals();
        scheduleSave(input.dataset.productId, input.value);
      });
    });
  </script>
</body>
</html>
